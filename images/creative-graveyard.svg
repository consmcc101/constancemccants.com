<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Creative Graveyard poster</title>
  <desc id="desc">A poster style illustration with large orange lettering and a cemetery motif.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="paperGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8dfca"/>
      <stop offset="100%" stop-color="#d7cdb4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#paperGrad)"/>
  <rect width="1200" height="1500" filter="url(#paper)" opacity="0.9"/>

