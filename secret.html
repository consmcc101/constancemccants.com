<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Secret</title>
  <style>
    @font-face {
      font-family: "FS Tahoma";
      src: url("fonts/fs-tahoma-8px.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0C0C0C;
      color: #fff;
      font-family: "FS Tahoma", monospace;
    }
    .gate, .secret {
      width: min(420px, calc(100vw - 40px));
      text-align: center;
    }
    .gate { font-size: 16px; }
    .gate form {
      display: grid;
      gap: 14px;
      justify-items: center;
    }
    .gate input {
      width: 100%;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 0;
      background: #0C0C0C;
      color: #fff;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      outline: none;
    }
    .gate input:focus { border-color: #fff; }
    .gate button {
      border: 1px solid #fff;
      background: #0C0C0C;
      color: #fff;
      padding: 10px 18px;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }
    .gate button:hover, .gate button:focus-visible {
      background: #fff;
      color: #0C0C0C;
    }
    .error {
      min-height: 1.2em;
      margin: 12px 0 0;
      color: #fff;
    }
    .secret { display: none; }
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <form id="password-form">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="off" autofocus>
      <button type="submit">Enter</button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </main>

  <main class="secret" id="secret" aria-label="Secret page">
    <p>Go Cocks</p>
  </main>

  <script>
    const form = document.getElementById("password-form");
    const input = document.getElementById("password");
    const error = document.getElementById("error");
    const gate = document.getElementById("gate");
    const secret = document.getElementById("secret");

    function unlock() {
      gate.style.display = "none";
      secret.style.display = "block";
      sessionStorage.setItem("treasureUnlocked", "true");
    }

    if (sessionStorage.getItem("treasureUnlocked") === "true") unlock();

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (input.value === "Cocks") {
        unlock();
      } else {
        error.textContent = "Incorrect password.";
        input.select();
      }
    });
  </script>
</body>
</html>
