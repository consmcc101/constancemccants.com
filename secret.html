<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Secret</title>
  <style>
    @font-face {
      font-family: "FS Tahoma";
      src: url("fonts/fs-tahoma-8px.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0C0C0C;
      color: #fff;
      font-family: "FS Tahoma", monospace;
    }
    .gate, .secret {
      width: min(760px, calc(100vw - 32px));
      height: min(460px, calc(100vh - 32px));
      position: relative;
      border: 3px solid #fff;
      outline: 1px solid #0C0C0C;
      box-shadow: 0 0 0 1px #fff;
      background: #0C0C0C;
      font-size: 16px;
    }
    .gate { text-align: left; }
    .window-title {
      height: 34px;
      margin: 0;
      padding: 7px 12px;
      border-bottom: 3px solid #fff;
      background: #fff;
      color: #0C0C0C;
      font-weight: 700;
      line-height: 17px;
    }
    .window-body {
      display: grid;
      grid-template-columns: 230px 1fr;
      height: calc(100% - 34px);
    }
    .menu {
      border-right: 3px solid #fff;
      padding: 18px 14px;
    }
    .menu p {
      margin: 0 0 8px;
      white-space: pre-line;
      line-height: 1.15;
    }
    .content {
      position: relative;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .password-box {
      width: min(360px, 90%);
      text-align: center;
    }
    .password-box label {
      display: block;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .password-box form {
      display: grid;
      gap: 14px;
    }
    .password-row {
      display: grid;
      grid-template-columns: 1fr 106px;
      gap: 10px;
    }
    .password-box input {
      min-width: 0;
      height: 34px;
      border: 2px solid #fff;
      border-radius: 0;
      background: #0C0C0C;
      color: #fff;
      padding: 4px 8px;
      font: inherit;
      font-size: 16px;
      outline: none;
    }
    .password-box input:focus {
      background: #fff;
      color: #0C0C0C;
    }
    .password-box button {
      height: 34px;
      border: 2px solid #fff;
      background: #fff;
      color: #0C0C0C;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      box-shadow: none;
    }
    .password-box button:hover,
    .password-box button:focus-visible {
      background: #0C0C0C;
      color: #fff;
    }
    .error {
      min-height: 18px;
      margin: 10px 0 0;
      text-align: center;
      color: #ff3030;
    }
    .password-box.shake {
      animation: password-shake 320ms ease-in-out;
    }
    @keyframes password-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .footer-line {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #fff;
      padding-top: 7px;
    }
    .secret {
      display: none;
      place-items: center;
      text-align: center;
    }
    @media (max-width: 620px) {
      .gate, .secret { height: min(420px, calc(100vh - 24px)); }
      .window-body { grid-template-columns: 150px 1fr; }
      .menu { padding: 12px 8px; }
      .password-row { grid-template-columns: 1fr; }
      .password-box button { width: 106px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <h1 class="window-title">SECRET ARCHIVE</h1>
    <div class="window-body">
      <aside class="menu" aria-label="Menu">
        <p>USERNAME:
  guest</p>
        <p>ACCESS:
  LOCKED</p>
        <p>STATUS:
  Awaiting Password</p>
      </aside>
      <section class="content">
        <div class="password-box">
          <form id="password-form">
            <label for="password">ENTER PASSWORD</label>
            <div class="password-row">
              <input id="password" type="password" autocomplete="off" autofocus aria-label="Password">
              <button type="submit">ENTER</button>
            </div>
          </form>
          <p class="error" id="error" role="alert"></p>
        </div>
        <div class="footer-line" aria-hidden="true">
          <span>Help</span>
          <span>Cancel</span>
        </div>
      </section>
    </div>
  </main>

  <main class="secret" id="secret" aria-label="Secret page">
    <p>GO COCKS</p>
  </main>

  <script>
    const form = document.getElementById("password-form");
    const input = document.getElementById("password");
    const error = document.getElementById("error");
    const gate = document.getElementById("gate");
    const secret = document.getElementById("secret");
    const passwordBox = document.querySelector(".password-box");

    function unlock() {
      gate.style.display = "none";
      secret.style.display = "block";
      sessionStorage.setItem("treasureUnlocked", "true");
    }

    if (sessionStorage.getItem("treasureUnlocked") === "true") unlock();

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (input.value === "Cocks") {
        unlock();
      } else {
        error.textContent = "Incorrect password.";
        input.select();
        passwordBox.classList.remove("shake");
        void passwordBox.offsetWidth;
        passwordBox.classList.add("shake");
        setTimeout(() => passwordBox.classList.remove("shake"), 320);
      }
    });
  </script>
</body>
</html>
